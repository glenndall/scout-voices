# On a pull request that adds or changes voices: listens to each one's example Shorts with YakScout and shows how close
# their voices are to the submitted voiceprint, in this check's summary. A helper for the reviewer, not the decision:
# YouTube sometimes refuses GitHub's servers, and those examples are marked "couldn't check" instead of failing.
# Like every pull-request check, it runs with read-only access and no secrets.
name: verify
on:
  pull_request:
    paths: ["voices/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: glenndall/yakscout
          path: .yakscout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YakScout's voice check
        run: |
          pip install --quiet numpy==2.1.3 onnxruntime==1.20.1 imageio-ffmpeg==0.6.0
          python .yakscout/get_model.py .yakscout/models
      - name: Listen to the examples
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'voices/*.json')
          echo "Changed voices: $files"
          if [ -z "$files" ]; then echo "No voice files added or changed." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python tools/verify_pr.py .yakscout $files
