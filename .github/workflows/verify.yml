# On a pull request that adds or changes voices: listens to each one's example Shorts with Scout and posts a plain
# verdict as a comment on the pull request (✅ checks out / ❌ don't merge / ⏸ couldn't check yet).
#
# Safety: this runs the workflow and scripts from main (pull_request_target), never the pull request's own code. From
# the pull request it only copies the voice files, which are read as JSON data.
name: verify
on:
  pull_request_target:
    paths: ["voices/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4                 # main: the trusted check.py and tools/
      - uses: actions/checkout@v4
        with:
          repository: glenndall/scout
          path: .yakscout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Scout's voice check
        run: |
          pip install --quiet numpy==2.1.3 onnxruntime==1.20.1 imageio-ffmpeg==0.6.0 yt-dlp
          python .yakscout/get_model.py .yakscout/models
      - name: Copy the submitted voice files (data only)
        run: |
          git fetch --quiet origin "pull/${{ github.event.pull_request.number }}/head:submitted"
          mkdir -p .submitted
          for f in $(git diff --name-only --diff-filter=AM HEAD...submitted -- 'voices/*.json'); do
            case "$f" in voices/*.json) git show "submitted:$f" > ".submitted/$(basename "$f")";; esac
          done
          ls -la .submitted
      - name: Listen to the examples
        id: listen
        continue-on-error: true
        run: |
          files=$(ls .submitted/*.json 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No voice files added or changed." > verdict.md; exit 0; fi
          python tools/verify_pr.py .yakscout $files > verdict.md
      - name: Post the verdict on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Voice check"; echo; cat verdict.md; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md
      - name: Fail the check unless the voice checked out
        if: steps.listen.outcome != 'success'
        run: exit 1
