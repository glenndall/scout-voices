# Checks every voice file on each push and pull request (complete, evidence, the right model, no duplicates).
name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the voice files
        run: python3 check.py --check
